name: Package Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [created]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          rm -f mdreader.zip
          zip -r mdreader.zip . \
            -x '*.git*' \
            -x 'node_modules/*' \
            -x '.github/*' \
            -x '*.md' \
            -x 'docs/*' \
            -x 'icon.svg'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdreader
          path: mdreader.zip

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mdreader.zip
