<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #ffffff; --fg: #111827; --muted: #4b5563; --border: #d1d5db;
      --btn: #f9fafb; --btn-hover: #e5e7eb; --primary: #2563eb; --primary-hover: #1d4ed8;
      --link: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --border: #374151;
        --btn: #1f2937; --btn-hover: #374151; --primary: #3b82f6; --primary-hover: #2563eb;
        --link: #60a5fa;
      }
    }
    body { width: 260px; font: 14px system-ui, sans-serif; padding: 12px; margin: 0; color: var(--fg); background: var(--bg); }
    h3 { margin: 0 0 10px; font-size: 15px; }
    button { width: 100%; padding: 8px; margin: 4px 0; border: 1px solid var(--border); border-radius: 6px; background: var(--btn); color: var(--fg); cursor: pointer; font: inherit; }
    button:hover { background: var(--btn-hover); }
    .primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .primary:hover { background: var(--primary-hover); }
    .status { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
    a { font-size: 12px; color: var(--link); }
  </style>
</head>
<body>
  <h3>Page → Markdown</h3>
  <button id="copy" class="primary">Copy to clipboard</button>
  <button id="download">Download .md</button>
  <div class="status" id="status"></div>
  <p><a id="options" href="#">Options / API key</a></p>
  <script src="popup.js"></script>
</body>
</html>
