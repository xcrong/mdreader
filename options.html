<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #ffffff; --fg: #111827; --muted: #6b7280; --border: #d1d5db;
      --input: #ffffff; --btn: #2563eb; --btn-hover: #1d4ed8; --ok: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --border: #374151;
        --input: #1f2937; --btn: #3b82f6; --btn-hover: #2563eb; --ok: #4ade80;
      }
    }
    body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: var(--fg); background: var(--bg); }
    h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--input); color: var(--fg); }
    button { margin-top: 12px; padding: 8px 16px; border: none; border-radius: 6px; background: var(--btn); color: #fff; cursor: pointer; font: inherit; }
    button:hover { background: var(--btn-hover); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
    #status { margin-top: 8px; color: var(--ok); }
  </style>
</head>
<body>
  <h2>Options</h2>
  <label for="apiKey">Jina API key (optional)</label>
  <input id="apiKey" type="password" placeholder="Leave empty to use free tier (20 req/min per IP)" />
  <button id="save">Save</button>
  <div id="status"></div>
  <p class="hint">Get a key at https://jina.ai/reader — increases rate limits. Stored in chrome.storage.sync.</p>
  <script src="options.js"></script>
</body>
</html>
