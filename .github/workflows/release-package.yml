name: Package Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [created]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build chromium + firefox packages (uBlock-style)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then
            VER="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          fi
          echo "Version: $VER"
          rm -f "mdreader_${VER}.chromium.zip" "mdreader_${VER}.firefox.zip" "mdreader_${VER}.firefox.xpi" SHA256SUMS.txt
          rm -rf /tmp/pkg-chromium /tmp/pkg-firefox
          mkdir -p /tmp/pkg-chromium /tmp/pkg-firefox

          EXCLUDES=('*.git*' 'node_modules/*' '.github/*' '*.md' 'docs/*' 'icon.svg' '*.zip')

          # ---- chromium: service_worker only ----
          cp -r . /tmp/pkg-chromium/
          python3 - <<'PY'
          import json
          p = "/tmp/pkg-chromium/manifest.json"
          m = json.load(open(p))
          m.get("background", {}).pop("scripts", None)
          json.dump(m, open(p, "w"), indent=2)
          print("chromium background:", m.get("background"))
          PY
          (cd /tmp/pkg-chromium && zip -r "$GITHUB_WORKSPACE/mdreader_${VER}.chromium.zip" . $(printf -- '-x %s ' "${EXCLUDES[@]}"))

          # ---- firefox: scripts only (service_worker unsupported, mozilla bug 1573659) ----
          cp -r . /tmp/pkg-firefox/
          python3 - <<'PY'
          import json
          p = "/tmp/pkg-firefox/manifest.json"
          m = json.load(open(p))
          bg = m.setdefault("background", {})
          bg.pop("service_worker", None)
          bg["scripts"] = ["background.js"]
          g = m.setdefault("browser_specific_settings", {}).setdefault("gecko", {})
          g.setdefault("id", "pagetomarkdown@xcrong.local")
          g.setdefault("strict_min_version", "109.0")
          json.dump(m, open(p, "w"), indent=2)
          print("firefox background:", m.get("background"))
          PY
          (cd /tmp/pkg-firefox && zip -r "$GITHUB_WORKSPACE/mdreader_${VER}.firefox.zip" . $(printf -- '-x %s ' "${EXCLUDES[@]}"))
          # unsigned xpi = same content, renamed (AMO signed .xpi needs web-ext sign + API secrets)
          cp "mdreader_${VER}.firefox.zip" "mdreader_${VER}.firefox.xpi"

          sha256sum "mdreader_${VER}.chromium.zip" "mdreader_${VER}.firefox.zip" "mdreader_${VER}.firefox.xpi" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh "mdreader_${VER}".* SHA256SUMS.txt

      - name: Optional CRX note
        env:
          CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_KEY" ]; then
            echo "CRX build requested but skipped: Chrome dropped sideloaded CRX; use Web Store or chromium.zip instead."
          else
            echo "No CRX_PRIVATE_KEY secret; skipping CRX (chromium.zip covers manual install)."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdreader
          path: |
            mdreader_*.chromium.zip
            mdreader_*.firefox.zip
            mdreader_*.firefox.xpi
            SHA256SUMS.txt

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mdreader_*.chromium.zip
            mdreader_*.firefox.zip
            mdreader_*.firefox.xpi
            SHA256SUMS.txt
